name: Topic CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  packages: read

jobs:
  topic:
    if: github.event.pull_request.draft == false
    uses: arm/ai-ml-sdk-for-vulkan/.github/workflows/collect-and-build-topic.yml@main
    with:
      topic_branch: ${{ github.head_ref }}
