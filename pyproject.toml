[build-system]
requires = ["setuptools>=77.0.3", "setuptools-scm>=8", "wheel", "cmake>=3.25", "ninja>=1.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_ml_emulation_layer_for_vulkan"
description = "ML Emulation Layer for Vulkan"
readme = "README.md"
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["LICENSES/*.txt"]
authors = [
    { name = "Arm Limited" }
]
requires-python = ">=3.10"

[project.scripts]
emulation_layer = "emulation_layer.cli:main"

[tool.setuptools]
package-dir = { "" = "pip_package" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["pip_package"]
exclude = ["tests*"]

[tool.setuptools.package-data]
emulation_layer = ["binaries/**"]

[tool.setuptools_scm]
fallback_version = "0.11.0"

[tool.black]
target-version = ['py310']

[tool.uv]
managed = true
package = false

[dependency-groups]
test = [
    "pytest==9.0.3",
    "pytest-xdist==3.8.0",
]
tooling = [
    "argcomplete==3.6.2",
    "breathe==4.36.0",
    "build==1.3.0",
    "debian-inspector==31.1.0",
    "gcovr==7.0; sys_platform == 'linux'",
    "myst_parser==4.0.1",
    "pre-commit==4.5.1",
    "setuptools==84.2.1",
    "sphinx==8.1.3",
    "sphinx_rtd_theme==3.0.2",
    "sphinxcontrib.plantuml==0.31",
    "wheel==0.41.2",
]

[tool.isort]
profile = "black"
force_single_line = true
